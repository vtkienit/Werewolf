spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              "[/api/**]":
                allowed-origins:
                  - ${CORS_ALLOWED_ORIGINS:http://localhost}
                allowed-methods:
                  - GET
                  - POST
                  - PATCH
                  - OPTIONS
                allowed-headers:
                  - Accept
                  - Content-Type
                  - X-Host-Id
                  - X-Player-Token
                allow-credentials: false

          routes:
            - id: room-service
              uri: ${ROOM_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/rooms,/api/rooms/**

            - id: distribution-service
              uri: ${DISTRIBUTION_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/distribution/**

            - id: websocket-service
              uri: ${WEBSOCKET_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/ws,/ws/**

server:
  port: ${API_GATEWAY_PORT:8080}

management:
  server:
    port: ${MANAGEMENT_PORT:9080}
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true