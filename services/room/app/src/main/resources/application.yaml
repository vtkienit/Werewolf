server:
  port: ${ROOM_SERVICE_PORT:8081}

spring:
  config:
    import: "optional:file:../../../.env[.properties]"
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  application:
    name: room-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  internal-realtime:
    token: ${INTERNAL_REALTIME_TOKEN}
  public-frontend-url: ${PUBLIC_FRONTEND_URL:http://localhost}
  room-lock:
    acquisition-timeout: ${ROOM_LOCK_ACQUISITION_TIMEOUT:2s}
    lease-duration: ${ROOM_LOCK_LEASE_DURATION:10s}
    retry-interval: ${ROOM_LOCK_RETRY_INTERVAL:50ms}
  lobby:
    disconnect-grace-period: ${DISCONNECT_GRACE_PERIOD:10s}
  websocket:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost}

management:
  server:
    port: 9081
